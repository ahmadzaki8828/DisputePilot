name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts Postgres 16 (Docker is available on GitHub-hosted runners).
      - run: ./mvnw -B verify
      # Evals in fake (recorded) mode: replays evals/recordings, so CI never calls a provider. Also gates the
      # strict prompt-injection metric at system level (guards included) and that no wrong draft is ready.
      - run: ./mvnw -B -Peval test
        env:
          DP_EVAL_MODE: fake

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Docker path judges use: a clean `docker compose up --build` must reach a working demo with no keys.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A random admin token for this run, so the workflow carries no token literal; compose reads it from the env.
      - run: echo "DP_ADMIN_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: docker compose up --build -d
      - name: Wait for the dashboard and check the zero-key demo
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/bff/api/system && break
            sleep 5
          done
          curl -fsS http://localhost:3000/bff/api/system | grep -q '"paypalMode":"mock"'
          curl -fsS http://localhost:3000/ | grep -q "Inbox"
          # six starter disputes were seeded, and the AI is labelled as recorded
          curl -fsS -H "X-Admin-Token: $DP_ADMIN_TOKEN" http://localhost:8080/api/disputes | grep -o '"paypalDisputeId"' | wc -l | grep -q '^6$'
          curl -fsS http://localhost:3000/bff/api/system | grep -q '"llmMode":"recorded"'
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
