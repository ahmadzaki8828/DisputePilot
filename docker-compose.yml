# Session S0: database only. Session D extends this to the full stack (db + backend + web).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: disputepilot
      POSTGRES_USER: disputepilot
      # Throwaway local-development default; override with POSTGRES_PASSWORD in your shell or .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disputepilot}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disputepilot -d disputepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
