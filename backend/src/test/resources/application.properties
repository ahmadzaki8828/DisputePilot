# Test-wide defaults. Sessions may add keys here; please do not change another session's.

# Session A: the outbox worker and reconciliation poller are driven directly by their tests, so the
# scheduled runs stay off and cannot race a test's own fixtures.
dp.sync.scheduling-enabled=false

# Session B: auto-drafting on DisputeChangedEvent stays off test-wide, so a session whose test drives the
# webhook or sync pipeline never has the agent (and a live model client) run behind its back. The tests that
# are about auto-drafting turn it back on with dp.drafts.auto=true.
dp.drafts.auto=false

# Session B: and no test context ever builds a live model client, whatever DP_LLM_API_KEY happens to be set
# to on the machine running the build - unit tests never touch the network.
dp.llm.mode=recorded

# Session D: drafts run inline in tests (the async dispatch is for the live server), the starter disputes are not
# seeded at startup (tests load the fixtures themselves), and the demo limits are generous unless a test lowers them.
dp.drafts.async=false
dp.demo.seed-on-start=false

# Session D: the suite caches many Spring contexts (different properties, WireMock, fakes); small pools keep their
# combined connections well under Postgres' default max_connections of 100.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
