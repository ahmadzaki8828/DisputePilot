spring:
  application:
    name: disputepilot
  datasource:
    # Either one JDBC URL, or the parts (Render hands out host, port and database separately).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DP_DB_HOST:localhost}:${DP_DB_PORT:5432}/${DP_DB_NAME:disputepilot}}
    username: ${SPRING_DATASOURCE_USERNAME:disputepilot}
    password: ${SPRING_DATASOURCE_PASSWORD:disputepilot}
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

dp:
  admin-token: ${DP_ADMIN_TOKEN:}
  dev-endpoints: ${DP_DEV_ENDPOINTS:false}
  paypal:
    mode: ${PAYPAL_MODE:mock}                 # mock | sandbox (there is no live mode)
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  llm:
    mode: ${DP_LLM_MODE:}                     # live | recorded; blank = recorded unless a key is set
    api-key: ${DP_LLM_API_KEY:}
    model: ${DP_LLM_MODEL:}                       # blank = provider default: openai/gpt-oss-120b (openai-compatible) or claude-haiku-5-5 (anthropic)
    daily-cap: ${DP_LLM_DAILY_CAP:300}
    provider: ${DP_LLM_PROVIDER:openai-compatible}   # openai-compatible | anthropic
    base-url: ${DP_LLM_BASE_URL:}                    # e.g. https://api.groq.com/openai/v1
    max-attempts: ${DP_LLM_MAX_ATTEMPTS:4}           # retries on 429 / 5xx / connection errors
    retry-base-delay-ms: ${DP_LLM_RETRY_BASE_DELAY_MS:1000}
  demo:
    rate-limit: ${DP_DEMO_RATE_LIMIT:6}
    action-limit: ${DP_DEMO_ACTION_LIMIT:30}      # simulate / reset calls per client IP per hour
    seed-on-start: ${DP_DEMO_SEED_ON_START:false} # load the starter disputes into an empty database at startup
  eval:
    mode: ${DP_EVAL_MODE:fake}                # fake | live
  sync:                                       # Session A: webhook outbox worker and reconciliation poller
    scheduling-enabled: ${DP_SYNC_SCHEDULING:true}
    outbox-interval: ${DP_OUTBOX_INTERVAL:PT5S}
    poll-interval: ${DP_SYNC_POLL_INTERVAL:PT10M}
